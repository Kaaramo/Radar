<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="RADAR logo mark">
  <title>RADAR</title>
  <!-- Origin dot (royal pulse origin) -->
  <circle cx="14" cy="50" r="3" fill="#2251FF"/>
  <!-- Pulse arc 1 (innermost, full opacity) -->
  <path d="M 14 38 A 12 12 0 0 1 26 50" stroke="#2251FF" stroke-width="3" stroke-linecap="round"/>
  <!-- Pulse arc 2 (mid, 60% opacity) -->
  <path d="M 14 26 A 24 24 0 0 1 38 50" stroke="#2251FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Pulse arc 3 (outermost, 30% opacity) -->
  <path d="M 14 14 A 36 36 0 0 1 50 50" stroke="#2251FF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <!-- Detected signal (royal-light dot on outer arc) -->
  <circle cx="45" cy="22" r="2.5" fill="#4F73FF"/>
</svg>
