services:
  postgres:
    image: postgres:17-alpine
    container_name: radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - radar_pg_data:/var/lib/postgresql/data
      # Schema applique automatiquement a la PREMIERE init (base vide).
      # Genere depuis packages/database/prisma/schema.prisma via :
      #   prisma migrate diff --from-empty --to-schema-datamodel schema.prisma --script
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: radar-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - ../../../apps/agent/openclaw-data:/home/node/.openclaw
      - ../../../apps/agent/workspace:/home/node/.openclaw/workspace
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Fallback optionnel : defaut vide pour eviter un warning si absent du .env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_INTERNAL_SECRET: ${OPENCLAW_INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../../
      dockerfile: infra/docker/web/Dockerfile
    container_name: radar-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base LOCALE par defaut : nom de service Docker "postgres" (reseau interne).
      # En dur ici pour que la stack tourne partout sans dependre du .env hote.
      # Pour basculer sur Neon : remplacer par ${DATABASE_NEON}.
      DATABASE_URL: postgresql://radar:radar@postgres:5432/radar?schema=public
      OPENCLAW_URL: http://openclaw:18789
      OPENCLAW_INTERNAL_SECRET: ${OPENCLAW_INTERNAL_SECRET}
      # Better Auth (requis au runtime par la route /api/auth/*)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-google-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_started

volumes:
  radar_pg_data:
