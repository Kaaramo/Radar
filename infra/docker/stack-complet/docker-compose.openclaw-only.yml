# ─────────────────────────────────────────────────────────────────────────
# RADAR — stack OpenClaw seul (mode dev : Next.js tourne en local pnpm dev)
#
# Architecture dev simplifiée :
#   - OpenClaw : Docker (image officielle, zéro build local)
#   - Next.js  : `pnpm dev` sur l'hôte (port 3000, hot reload)
#   - Postgres : Neon cloud
#
# Communication :
#   - Next.js → OpenClaw : http://localhost:18789 (port exposé Docker → hôte)
#   - OpenClaw → Next.js : http://host.docker.internal:3000 (alias Docker)
#
# Lancer :
#   cd infra/docker/stack-complet
#   docker compose -f docker-compose.openclaw-only.yml \
#     --env-file ../../../apps/web/.env.local up -d
#
# Stopper :
#   docker compose -f docker-compose.openclaw-only.yml down
# ─────────────────────────────────────────────────────────────────────────

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: radar-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - ../../../apps/agent/openclaw-data:/home/node/.openclaw
      - ../../../apps/agent/workspace:/home/node/.openclaw/workspace
    environment:
      # LLM principal
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Recherche web
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Secret M2M pour les callbacks → Next.js
      OPENCLAW_INTERNAL_SECRET: ${OPENCLAW_INTERNAL_SECRET}
      # URL pour les callbacks vers Next.js qui tourne sur l'hôte (pas en Docker)
      # `host.docker.internal` est l'alias Docker Desktop pour atteindre l'hôte.
      RADAR_WEB_BASE_URL: http://host.docker.internal:3000
    # Sur Docker Desktop Windows/Mac, `host.docker.internal` marche nativement.
    # Sur Linux pur, il faut l'ajouter explicitement via extra_hosts :
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Les SKILL.md de l'orchestrateur appellent http://web:3000/api/internal/*
      # (nom d'hote prevu pour le full-Docker). En mode hybride (Next.js sur l'hote),
      # on alias `web` vers l'hote pour que les callbacks atteignent `pnpm dev`.
      - "web:host-gateway"
